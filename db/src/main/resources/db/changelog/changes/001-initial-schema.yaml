databaseChangeLog:
  - changeSet:
      id: 001-initial-schema
      author: qrun
      changes:
        - createTable:
            tableName: platform_setting
            columns:
              - column:
                  name: setting_key
                  type: varchar(128)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: setting_value
                  type: varchar(1024)
                  constraints:
                    nullable: false
