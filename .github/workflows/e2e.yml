name: Required E2E validation
'on':
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 6 * * *
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    uses: QRun-IO/qqq-orb/.github/workflows/business-e2e.yml@0965a4565369a74650c8f96683b2296435a35382
    secrets:
      E2E_ALERT_WEBHOOK_URL: ${{ secrets.E2E_ALERT_WEBHOOK_URL }}
