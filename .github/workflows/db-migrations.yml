name: Database migrations
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  validate:
    uses: QRun-IO/qqq-orb/.github/workflows/business-db.yml@5bcec90e330b1b4d7ec416d64b065e0aed74a6ff
concurrency:
  group: business-db-${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
