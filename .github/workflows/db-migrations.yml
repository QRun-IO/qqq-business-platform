name: Database migrations
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  validate:
    uses: QRun-IO/qqq-orb/.github/workflows/business-db.yml@0f33ddadf88b9a1b940b8883782fe2000ee1d2bd
concurrency:
  group: business-db-${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
