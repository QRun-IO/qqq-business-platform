newsletter:
  provider: ${NEWSLETTER_PROVIDER:smtp}
  from: ${NEWSLETTER_FROM:no-reply@localhost}
  confirmation-base-url: ${NEWSLETTER_CONFIRM_URL:http://localhost:8080/api/public/v1/newsletter/confirm}
  token-ttl: ${NEWSLETTER_TOKEN_TTL:PT48H}
  worker:
    delay-ms: ${NEWSLETTER_WORKER_DELAY_MS:5000}
    batch-size: ${NEWSLETTER_WORKER_BATCH_SIZE:50}
spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
  sql.init.mode: always
