services:
  app:
    image: qqq-business-platform:0.1.0-SNAPSHOT
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qqq
      SPRING_DATASOURCE_USERNAME: qqq
      SPRING_DATASOURCE_PASSWORD: qqq
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qqq
      POSTGRES_USER: qqq
      POSTGRES_PASSWORD: qqq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qqq"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  postgres-data:
